<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Box -->
  <rect width="512" height="512" rx="100" fill="url(#darkBg)" stroke="#1E293B" stroke-width="8"/>
  
  <!-- Outer Tactical Rhombus Frame -->
  <polygon points="256,48 448,256 256,464 64,256" fill="none" stroke="url(#cyanGlow)" stroke-width="12" filter="url(#glow)"/>
  <polygon points="256,80 416,256 256,432 96,256" fill="#030712" fill-opacity="0.8" stroke="#38BDF8" stroke-width="4" stroke-dasharray="16 8"/>

  <!-- Center Double Diamond / Rhodes Crest -->
  <polygon points="256,140 340,256 256,372 172,256" fill="url(#cyanGlow)" />
  <polygon points="256,180 300,256 256,332 212,256" fill="#0F172A" />
  
  <!-- Inner Crosshair / Reticle Lines -->
  <line x1="256" y1="100" x2="256" y2="160" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="352" x2="256" y2="412" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="256" x2="160" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="352" y1="256" x2="412" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Tactical Center Core -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
</svg>