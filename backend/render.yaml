services:
  - type: web
    name: arknights-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false
